# Paynomenon local stack.   docker compose up -d --build        (or: make up)
# Profiles: default = app + dependencies;  observability = Prometheus + Grafana.
name: paynomenon

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paynomenon}
      POSTGRES_USER: ${POSTGRES_USER:-paynomenon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paynomenon} -d ${POSTGRES_DB:-paynomenon}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}

  kafka:
    image: apache/kafka:3.9.0
    <<: *restart
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build: {context: ., dockerfile: infrastructure/docker/backend.Dockerfile}
    <<: *restart
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      PAYNOMENON_ENV: ${PAYNOMENON_ENV:-development}
      PAYNOMENON_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paynomenon}
      PAYNOMENON_DB_USER: ${POSTGRES_USER:-paynomenon}
      PAYNOMENON_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PAYNOMENON_REDIS_HOST: redis
      PAYNOMENON_KAFKA_BOOTSTRAP: kafka:9092
      PAYNOMENON_EVENTS_TRANSPORT: kafka
      PAYNOMENON_JWT_SECRET: ${PAYNOMENON_JWT_SECRET:?set PAYNOMENON_JWT_SECRET (>= 32 chars)}
      PAYNOMENON_SERVICE_TOKEN: ${PAYNOMENON_SERVICE_TOKEN:?set PAYNOMENON_SERVICE_TOKEN}
      PAYNOMENON_AI_SERVICE_TOKEN: ${AI_INTERNAL_TOKEN:?set AI_INTERNAL_TOKEN}
      PAYNOMENON_CALLBACK_SECRET: ${PAYNOMENON_CALLBACK_SECRET:?set PAYNOMENON_CALLBACK_SECRET}
      PAYNOMENON_METRICS_USER: ${PAYNOMENON_METRICS_USER:-prometheus}
      PAYNOMENON_METRICS_PASSWORD: ${PAYNOMENON_METRICS_PASSWORD:?set PAYNOMENON_METRICS_PASSWORD}
      PAYNOMENON_DEMO_USERS_ENABLED: ${PAYNOMENON_DEMO_USERS_ENABLED:-true}
      PAYNOMENON_DEMO_VIEWER_PASSWORD: ${PAYNOMENON_DEMO_VIEWER_PASSWORD:-}
      PAYNOMENON_DEMO_INVESTIGATOR_PASSWORD: ${PAYNOMENON_DEMO_INVESTIGATOR_PASSWORD:-}
      PAYNOMENON_DEMO_ADMIN_PASSWORD: ${PAYNOMENON_DEMO_ADMIN_PASSWORD:-}
      PAYNOMENON_AI_URL: http://ai-service:8090
      PAYNOMENON_SIMULATION_ENABLED: ${PAYNOMENON_SIMULATION_ENABLED:-true}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    stop_grace_period: 30s

  ai-service:
    build: {context: ., dockerfile: infrastructure/docker/ai-service.Dockerfile}
    <<: *restart
    environment:
      AI_ENVIRONMENT: ${PAYNOMENON_ENV:-development}
      AI_BACKEND_URL: http://backend:8080
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      AI_BACKEND_SERVICE_TOKEN: ${PAYNOMENON_SERVICE_TOKEN}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
    ports: ["127.0.0.1:${AI_PORT:-8090}:8090"]
    stop_grace_period: 20s

  frontend:
    build: {context: ., dockerfile: infrastructure/docker/frontend.Dockerfile}
    <<: *restart
    depends_on: [backend]
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:80"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    <<: *restart
    environment:
      PAYNOMENON_METRICS_PASSWORD: ${PAYNOMENON_METRICS_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$PAYNOMENON_METRICS_PASSWORD" > /tmp/metrics_password
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=7d
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
